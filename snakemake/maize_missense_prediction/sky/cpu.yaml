name: maize-missense-cpu
workdir: snakemake/maize_missense_prediction
resources:
  infra: aws
  cpus: 8+
  memory: 32+
  disk_size: 100
  use_spot: false
  max_hourly_cost: 0.65
envs:
  TARGET: all
  POLARS_MAX_THREADS: "4"
  RAYON_NUM_THREADS: "4"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  CONDA_CHANNEL_PRIORITY: strict
setup: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  if [ "$(uv --version 2>/dev/null || true)" != "uv 0.11.31" ]; then
    curl -LsSf https://astral.sh/uv/0.11.31/install.sh | sh
  fi
  if [ ! -x "$HOME/.local/share/maize-missense-conda/bin/conda" ]; then
    conda create -p "$HOME/.local/share/maize-missense-conda" --override-channels -c conda-forge conda=25.7.0 -y -q
  fi
  export PATH="$HOME/.local/share/maize-missense-conda/bin:$PATH"
  conda config --set channel_priority strict
  conda --version
run: |
  set -euo pipefail
  export PATH="$HOME/.local/share/maize-missense-conda/bin:$HOME/.local/bin:$PATH"
  export CONDA_EXE="$HOME/.local/share/maize-missense-conda/bin/conda"
  conda config --set channel_priority strict
  case "$TARGET" in all|prepare|prepare_controls) ;; *) echo "TARGET must be all, prepare or prepare_controls"; exit 1 ;; esac
  uv sync --locked
  uv run --locked snakemake "$TARGET" --jobs 1 --cores 8
