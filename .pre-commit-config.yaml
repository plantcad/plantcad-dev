ci:
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "Update pre-commit hooks"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '\.sky\.yaml$'
      - id: debug-statements
      - id: mixed-line-ending
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-no-log-warn
      - id: text-unicode-replacement-char
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff-format
        exclude: ^snakemake/maize_missense_prediction/
      - id: ruff
        exclude: ^snakemake/maize_missense_prediction/
        args: ["--fix", "--show-fixes"]
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args: ["--option", "array_auto_collapse=false"]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 0.0.1
    hooks:
      - id: pyrefly-typecheck-system
        pass_filenames: false
        exclude: ^snakemake/maize_missense_prediction/
  - repo: local
    hooks:
      - id: maize-missense-ruff
        name: maize missense Ruff
        language: system
        entry: uv run --project snakemake/maize_missense_prediction --locked ruff check --fix
        files: ^snakemake/maize_missense_prediction/.*\.py$
      - id: maize-missense-ruff-format
        name: maize missense Ruff format
        language: system
        entry: uv run --project snakemake/maize_missense_prediction --locked ruff format
        files: ^snakemake/maize_missense_prediction/.*\.py$
      - id: maize-missense-ty
        name: maize missense ty
        language: system
        entry: uv run --project snakemake/maize_missense_prediction --locked ty check --project snakemake/maize_missense_prediction
        files: ^snakemake/maize_missense_prediction/.*(\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: maize-missense-snakefmt
        name: maize missense snakefmt
        language: system
        entry: uv run --project snakemake/maize_missense_prediction --locked snakefmt
        files: ^snakemake/maize_missense_prediction/.*(Snakefile|\.smk)$
